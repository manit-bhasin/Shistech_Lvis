<svg xmlns="http://www.w3.org/2000/svg" width="766" height="361" viewBox="0 0 766 361" role="img">
<title>An SOS hops node to node to the base; the confirmation hops back</title>
<style>
.d-title { font: 700 14px "Liberation Sans", Arial, Helvetica, sans-serif; fill: #1b2420; }
.d-line { font: 12px "Liberation Sans", Arial, Helvetica, sans-serif; fill: #5b655e; }
.d-inv .d-title { fill: #ffffff; }
.d-inv .d-line { fill: #dfe5dd; }
.d-edge { font: 700 10px "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #1b2420; letter-spacing: 0.04em; }
.d-note { font: 11.5px "Liberation Sans", Arial, Helvetica, sans-serif; fill: #5b655e; }
.c-tick { font: 10.5px "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #5b655e; }
.c-val { font: 700 11px "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #1b2420; }
.c-axis { font: 10.5px "Liberation Sans", Arial, Helvetica, sans-serif; fill: #5b655e; }

.f-title { font: 700 16px "Liberation Sans", Arial, Helvetica, sans-serif; fill: #1b2420; }
.f-sub { font: 11px "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #5b655e; }
.f-key { font: 12px "Liberation Sans", Arial, Helvetica, sans-serif; fill: #5b655e; }
</style>
<rect x="6" y="6" width="758" height="352.5" fill="#1b2420" fill-opacity="0.18"/>
<rect x="1" y="1" width="758" height="352.5" fill="#ffffff" stroke="#1b2420" stroke-width="1.5"/>
<text class="f-title" x="22" y="40">An SOS hops node to node to the base; the confirmation hops back</text>
<svg x="22" y="50.0" width="716" height="282.5" viewBox="0 0 664 262">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1b2420"/></marker>
  <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1e8455"/></marker>
</defs>
<text class="d-note" x="242" y="14" text-anchor="middle">No confirmation in 90 s: send again, up to 5 sends</text>
<path d="M262 46 V25 H222 V44" fill="none" stroke="#1b2420" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<line x1="133" y1="83.0" x2="174" y2="83.0" stroke="#1b2420" stroke-width="1.5" marker-end="url(#ah)"/>
<text class="d-edge" x="154.0" y="76.0" text-anchor="middle">WI-FI</text>
<line x1="309" y1="83.0" x2="350" y2="83.0" stroke="#1b2420" stroke-width="1.5" marker-end="url(#ah)"/>
<text class="d-edge" x="330.0" y="76.0" text-anchor="middle">LORA</text>
<line x1="485" y1="83.0" x2="526" y2="83.0" stroke="#1b2420" stroke-width="1.5" marker-end="url(#ah)"/>
<text class="d-edge" x="506.0" y="76.0" text-anchor="middle">LORA</text>
<path d="M594.0 120 V154 H66.0 V184" fill="none" stroke="#1e8455" stroke-width="1.8" marker-end="url(#ahg)"/>
<text class="d-note" x="330" y="147" text-anchor="middle">Confirmation hops back the same way</text>
<rect x="4" y="50" width="132" height="74" fill="#1b2420" fill-opacity="0.16"/>
<rect x="0" y="46" width="132" height="74" fill="#ffffff" stroke="#1b2420" stroke-width="1.5"/>
<g class="">
<text class="d-title" x="66.0" y="71.0" text-anchor="middle">Person’s phone</text>
<text class="d-line" x="66.0" y="87.5" text-anchor="middle">opens SOS page</text>
<text class="d-line" x="66.0" y="104.0" text-anchor="middle">within 200 m</text>
</g>
<rect x="180" y="50" width="132" height="74" fill="#1b2420" fill-opacity="0.16"/>
<rect x="176" y="46" width="132" height="74" fill="#ffffff" stroke="#1b2420" stroke-width="1.5"/>
<g class="">
<text class="d-title" x="242.0" y="71.0" text-anchor="middle">Nearest node</text>
<text class="d-line" x="242.0" y="87.5" text-anchor="middle">critical first</text>
<text class="d-line" x="242.0" y="104.0" text-anchor="middle">after 0-1 s wait</text>
</g>
<rect x="356" y="50" width="132" height="74" fill="#1b2420" fill-opacity="0.16"/>
<rect x="352" y="46" width="132" height="74" fill="#ffffff" stroke="#1b2420" stroke-width="1.5"/>
<g class="">
<text class="d-title" x="418.0" y="71.0" text-anchor="middle">Relay nodes</text>
<text class="d-line" x="418.0" y="87.5" text-anchor="middle">forward each copy</text>
<text class="d-line" x="418.0" y="104.0" text-anchor="middle">drop duplicates</text>
</g>
<rect x="532" y="50" width="132" height="74" fill="#1b2420" fill-opacity="0.16"/>
<rect x="528" y="46" width="132" height="74" fill="#1b2420" stroke="#1b2420" stroke-width="1.5"/>
<g class="d-inv">
<text class="d-title" x="594.0" y="71.0" text-anchor="middle">Rescue base</text>
<text class="d-line" x="594.0" y="87.5" text-anchor="middle">logs the incident</text>
<text class="d-line" x="594.0" y="104.0" text-anchor="middle">confirms receipt</text>
</g>
<rect x="4" y="190" width="132" height="72" fill="#1b2420" fill-opacity="0.16"/>
<rect x="0" y="186" width="132" height="72" fill="#ffffff" stroke="#1b2420" stroke-width="1.5"/>
<g class="">
<text class="d-title" x="66.0" y="210.0" text-anchor="middle">Sender sees</text>
<text class="d-line" x="66.0" y="226.5" text-anchor="middle">“Delivered to</text>
<text class="d-line" x="66.0" y="243.0" text-anchor="middle">rescue base”</text>
</g>
</svg>
</svg>
